name: Living World Platform

on:
  push:
    branches: [Living-World-Phase15, Living-World-Phase16]
    paths-ignore:
      - 'experiments/living_world/PHASE16.md'
      - 'experiments/living_world/benchmarks/simulation/**'
  workflow_dispatch:
    inputs:
      package_url:
        description: HTTPS URL of the release ZIP for this commit
        type: string
      package_sha256:
        description: SHA-256 of the release ZIP
        type: string

permissions:
  contents: read

jobs:
  parity:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare deterministic scenario against the same fixture
        run: |
          python -B experiments/living_world/platform_scenario.py platform-trace.json
          python -c "import json; from pathlib import Path; assert json.loads(Path('platform-trace.json').read_bytes()) == json.loads(Path('tests/living_world_platform_expected.json').read_bytes())"
          python -B tests/living_world_population.py
          python -B tests/living_world_kanto_census.py
          python -B tests/living_world_kanto.py
          python -B tests/living_world_autonomy.py > autonomy-trace.json
          python -B tests/living_world_rules.py
          python -B tests/living_world_agency.py
          python -B tests/living_world_simulation.py
          python -B tests/living_world_release_scenario.py > release-scenario.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-world-parity-${{ matrix.os }}
          path: |
            platform-trace.json
            release-scenario.json
            autonomy-trace.json

  build-candidate:
    if: ${{ !inputs.package_url && !vars.LIVING_WORLD_PACKAGE_URL }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ROM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev
          python3 -m pip install Pillow numpy
      - name: Build and stage the exact validation ZIP
        run: bash experiments/living_world/build-ci-windows.sh Living-World-15.0.1-Agency-Preview-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: living-world-windows-candidate
          path: Living-World-15.0.1-Agency-Preview-Windows-x64.zip*
          compression-level: 0
          if-no-files-found: error
  windows-package:
    needs: build-candidate
    if: ${{ !cancelled() && (needs.build-candidate.result == 'success' || needs.build-candidate.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PACKAGE_URL: ${{ inputs.package_url || vars.LIVING_WORLD_PACKAGE_URL }}
      PACKAGE_SHA256: ${{ inputs.package_sha256 || vars.LIVING_WORLD_PACKAGE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.build-candidate.result == 'success'
        with:
          name: living-world-windows-candidate
      - name: Require the exact release candidate
        shell: pwsh
        run: |
          if ($env:PACKAGE_URL) {
            if (([uri]$env:PACKAGE_URL).Scheme -ne 'https' -or $env:PACKAGE_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
              throw 'An HTTPS package URL and SHA-256 digest are required.'
            }
            Invoke-WebRequest -Uri $env:PACKAGE_URL -OutFile release.zip
            $hash = $env:PACKAGE_SHA256
          } else {
            $candidate = 'Living-World-15.0.1-Agency-Preview-Windows-x64.zip'
            $hash = (Get-Content "$candidate.sha256" -Raw).Split()[0]
            Move-Item $candidate release.zip
          }
          if ((Get-FileHash release.zip -Algorithm SHA256).Hash -ne $hash) {
            throw 'Release ZIP SHA-256 mismatch.'
          }
          Expand-Archive release.zip -DestinationPath extracted
          $release = Get-Content extracted/LivingQuantumWorld/release.json -Raw | ConvertFrom-Json
          if ($release.commit -ne $env:GITHUB_SHA) { throw 'Package commit does not match this run.' }
      - name: Validate the extracted Windows package
        shell: pwsh
        run: |
          $root = (Resolve-Path extracted/LivingQuantumWorld).Path
          $syntaxErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $root 'launcher-windows.ps1'), [ref]$tokens, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors) { throw ($syntaxErrors | Out-String) }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'QuantumSmokeProfile'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          & "$root/python/python.exe" -B "$root/package_smoke.py" "$PWD/native-smoke.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure three offline planners on identical situations
        shell: pwsh
        run: |
          $root = (Resolve-Path extracted/LivingQuantumWorld).Path
          $runtime = Join-Path $root inference
          $bench = (Resolve-Path tests/living_world_agency_benchmark.py).Path
          $cases = @(
            @('model.gguf','qwen3','','e773ccf7adfa50fcabfa5ea0e30312e11f0e83bf4ae00e6a38503e49358d1952'),
            @('qwen17.gguf','qwen3','https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf','b139949c5bd74937ad8ed8c8cf3d9ffb1e99c866c823204dc42c0d91fa181897'),
            @('gemma1.gguf','gemma','https://huggingface.co/ggml-org/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf','8ccc5cd1f1b3602548715ae25a66ed73fd5dc68a210412eea643eb20eb75a135')
          )
          foreach ($case in $cases) {
            $model = Join-Path $runtime $case[0]
            if ($case[2]) { curl.exe --fail --location --retry 2 --output $model $case[2] }
            if ((Get-FileHash $model).Hash -ne $case[3]) { throw 'Benchmark weight mismatch' }
            & "$root/python/python.exe" -B $bench $runtime $model $case[1] > "agency-$($case[0]).jsonl"
            if ($LASTEXITCODE) { throw 'Agent benchmark failed' }
            $simulation = (Resolve-Path experiments/living_world/benchmark_simulation.py).Path
            & "$root/python/python.exe" -B -c "import pathlib,runpy,sys; script=sys.argv.pop(1); sys.path.insert(0,str(pathlib.Path(script).parent)); runpy.run_path(script,run_name='__main__')" $simulation $runtime $model $case[1] --case cooperation --decisions 4 > "simulation-$($case[0]).jsonl"
            if ($LASTEXITCODE) { throw 'Headless agent benchmark failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-world-native-windows-report
          path: |
            native-smoke.json
            agency-*.jsonl
            simulation-*.jsonl
